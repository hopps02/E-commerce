name: CI

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Run code generation (build_runner)
        run: dart run build_runner build

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Read app version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # BASE_URL is left at the Env.baseUrl default (https://api.try4u.co/api/v1).
      # A browser will only accept those responses once the API sends
      # Access-Control-Allow-Origin for whatever origin this bundle is served
      # from — it does not today. Serving the bundle behind a reverse proxy
      # that fronts /api on the same origin is the alternative, and then this
      # needs --dart-define=BASE_URL=/api/v1 instead.
      - name: Build web (release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: flutter build web --release

      - name: Upload web build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ steps.version.outputs.version }}
          path: build/web
          if-no-files-found: error
