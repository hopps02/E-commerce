# LIFECYCLE C2b — stock dropped to 1 behind the customer's back; reopening
# the cart must clamp the line and tell the user.
appId: com.utr.foryou
---
# leave the cart (home tab), then come back so the validate re-runs
- tapOn:
    point: 86%,92%
- waitForAnimationToEnd
- tapOn:
    point: 46%,92%
- takeScreenshot: /tmp/qa-i4-clamp-toast
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "تكلفة الشحن"
    timeout: 15000
- takeScreenshot: /tmp/qa-i5-cart-clamped
