# FULL customer loop on the SAME order that crossed all three apps:
# (login if needed as the customer who owns JAR-000386) -> My Orders ->
# previous tab shows it delivered (step 3) -> details (real items, halalas
# prices, address) -> rate it (4 axes) -> backend stores the rating.
appId: com.utr.foryou
---
- stopApp
- launchApp
- waitForAnimationToEnd
# login only when a session isn't already established
- runFlow:
    when:
      visible: "تسجيل الدخول"
    commands:
      - tapOn: "أدخل رقم جوالك"
      - inputText: "500003005"
      - tapOn: "تسجيل الدخول"
      - tapOn: "إرسال رمز التحقق"
      - extendedWaitUntil:
          visible: "تأكيد"
          timeout: 15000
      - tapOn:
          text: "_"
          index: 0
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - tapOn: "تأكيد"
      - extendedWaitUntil:
          visible: "ابدأ التسوق"
          timeout: 15000
      - tapOn: "ابدأ التسوق"
      - waitForAnimationToEnd
# dismiss the location prompt if it appears (browse needs it; orders don't)
- runFlow:
    when:
      visible: "تفعيل الموقع"
    commands:
      - tapOn:
          point: 8%,84%
      - waitForAnimationToEnd
- takeScreenshot: /tmp/4u-p4-customer-home
# go to My Orders tab (bottom navigation icon, second from the left)
- tapOn:
    point: 29%,92%
- waitForAnimationToEnd
- takeScreenshot: /tmp/4u-p4-my-orders-current
# previous orders tab contains the delivered JAR-000386
- tapOn: "السابقة"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*JAR-000386.*"
    timeout: 15000
- takeScreenshot: /tmp/4u-p4-my-orders-previous
# open its details (CustomInkButton needs a point tap)
- tapOn:
    point: 81%,54%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*JAR-000386.*"
    timeout: 15000
- takeScreenshot: /tmp/4u-p4-order-details
# price summary lives below the fold
- scrollUntilVisible:
    element:
      text: ".*ملخص السعر.*"
    direction: DOWN
- takeScreenshot: /tmp/4u-p4-price-summary
# rate the delivered order: open the sheet, give 5 stars overall, send
- tapOn: ".*تقييم.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*إرسال.*"
    timeout: 10000
- takeScreenshot: /tmp/4u-p4-rate-sheet
# five stars on every axis (leftmost star = 5 in RTL), then send
- tapOn:
    point: 25%,52%
- tapOn:
    point: 7%,60%
- tapOn:
    point: 7%,64%
- tapOn:
    point: 7%,68%
- takeScreenshot: /tmp/4u-p4-rate-filled
- tapOn: ".*إرسال.*"
- waitForAnimationToEnd
- takeScreenshot: /tmp/4u-p4-rate-submitted
