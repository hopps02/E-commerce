appId: com.utr.foryou
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "تسجيل الخروج"
    commands:
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "تسجيل الدخول"
    timeout: 15000
- tapOn: "أدخل رقم جوالك"
- inputText: "0"
- inputText: "5"
- inputText: "1"
- inputText: "2"
- inputText: "3"
- inputText: "4"
- inputText: "5"
- inputText: "6"
- inputText: "7"
- inputText: "8"
- waitForAnimationToEnd
- takeScreenshot: /tmp/auth-valid-final
