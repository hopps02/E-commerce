# LIFECYCLE A1 — cashier side for the app-placed order GOC-00000015:
# prepare 2/2 -> confirm ready -> assign captain.
appId: com.utr.foryou
---
- stopApp
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "تسجيل الخروج"
    commands:
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "الرئيسية"
    commands:
      - tapOn:
          point: 14%,92%
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "تسجيل الخروج"
          direction: DOWN
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "تسجيل الدخول"
    timeout: 15000
- tapOn: "أدخل رقم جوالك"
- inputText: "560002000"
- tapOn: "تسجيل الدخول"
- tapOn: "إرسال رمز التحقق"
- extendedWaitUntil:
    visible: "تأكيد"
    timeout: 15000
- tapOn:
    text: "_"
    index: 0
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- tapOn: "تأكيد"
- extendedWaitUntil:
    visible: "ابدأ التسوق"
    timeout: 15000
- tapOn: "ابدأ التسوق"
- waitForAnimationToEnd
# cashier home: the app-placed order is at the top of the preparation queue
- extendedWaitUntil:
    visible: ".*فهد.*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*GOC-00000015.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-g1-cashier-queue
# open it (top card's details button)
- tapOn:
    point: 50%,67%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*الكمية.*"
    timeout: 15000
# the cashier details screen has no order number by design — the items prove it
- assertVisible: ".*خبز صامولي.*"
- takeScreenshot: /tmp/qa-g2-cashier-details
# tick both items (real PATCHes)
- tapOn:
    point: 10%,34%
- tapOn:
    point: 10%,41%
- takeScreenshot: /tmp/qa-g3-cashier-prepared
# confirm readiness
- tapOn:
    point: 50%,92%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*تعيين كابتن.*"
    timeout: 15000
# assign the captain
- tapOn:
    point: 50%,92%
- extendedWaitUntil:
    visible: ".*اكتمل اليوم.*"
    timeout: 15000
- tapOn: ".*ناصر.*"
- waitForAnimationToEnd
- tapOn:
    point: 50%,95%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*جاري التوصيل.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-g4-cashier-assigned
