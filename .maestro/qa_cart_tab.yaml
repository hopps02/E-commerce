appId: com.utr.foryou
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "تسجيل الخروج"
    commands:
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "تسجيل الدخول"
    commands:
      - tapOn: "أدخل رقم جوالك"
      - inputText: "512345678"
      - tapOn: "إرسال رمز التحقق"
      - extendedWaitUntil:
          visible: "تأكيد"
          timeout: 15000
      - tapOn:
          text: "_"
          index: 0
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - tapOn: "تأكيد"
      - extendedWaitUntil:
          visible: "ابدأ التسوق"
          timeout: 15000
      - tapOn: "ابدأ التسوق"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "تفعيل الموقع"
    commands:
      - tapOn:
          point: 8%,84%
      - waitForAnimationToEnd
# open the CART tab (second nav item) — empty, but the nav bar must stay
- tapOn:
    point: 46%,92%
- waitForAnimationToEnd
- takeScreenshot: /tmp/cart-tab-empty
