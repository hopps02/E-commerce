# Cashier home renders REAL seeded backend orders (12 in branch 1).
# Pre-condition: a cashier session exists on the device (auth flow ran before).
appId: com.utr.foryou
---
- launchApp
- waitForAnimationToEnd
# splash validates the stored session -> cashier home greeted BY NAME from /cashier/me
- extendedWaitUntil:
    visible: ".*فهد.*"
    timeout: 20000
# real order numbers from the seeded data (JAR-...)
- extendedWaitUntil:
    visible: ".*JAR-.*"
    timeout: 15000
- takeScreenshot: /tmp/4u-p2-queue-preparation
# open the first prepare-order card (button center, % of screen) -> REAL details
- tapOn:
    point: 50%,67%
- waitForAnimationToEnd
- takeScreenshot: /tmp/4u-p2-order-details
