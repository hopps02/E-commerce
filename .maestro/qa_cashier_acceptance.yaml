# CASHIER ACCEPTANCE: fresh install -> login -> both queues -> prepare
# JAR-000385 (2 items) -> confirm ready -> assign captain -> on the way.
# Screenshots at every stage for the region-by-region design review.
appId: com.utr.foryou
---
- stopApp
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "التالي"
    commands:
      - tapOn: "التالي"
- runFlow:
    when:
      visible: "تسجيل الدخول"
    commands:
      - takeScreenshot: /tmp/qa-c0-auth
      - tapOn: "أدخل رقم جوالك"
      - inputText: "560002000"
      - tapOn: "تسجيل الدخول"
      - tapOn: "إرسال رمز التحقق"
      - extendedWaitUntil:
          visible: "تأكيد"
          timeout: 15000
      - takeScreenshot: /tmp/qa-c1-otp-sheet
      - tapOn:
          text: "_"
          index: 0
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - tapOn: "تأكيد"
      - extendedWaitUntil:
          visible: "ابدأ التسوق"
          timeout: 15000
      - tapOn: "ابدأ التسوق"
      - waitForAnimationToEnd
# cashier home: greeted by name, preparation queue with the real order
- extendedWaitUntil:
    visible: ".*فهد.*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*JAR-000385.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-c2-queue-preparation
# on-the-way tab: in-delivery + delivered cards
- tapOn: ".*للتوصيل.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*JAR-.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-c3-queue-ontheway
- tapOn: ".*التجهيز.*"
- waitForAnimationToEnd
# open the placed order -> details with unprepared items
- tapOn:
    point: 50%,67%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*الكمية.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-c4-details-unprepared
# tick both items (real PATCHes)
- tapOn:
    point: 10%,34%
- tapOn:
    point: 10%,41%
- takeScreenshot: /tmp/qa-c5-details-prepared
# confirm readiness -> ready for captain
- tapOn:
    point: 50%,92%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*تعيين كابتن.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-c6-ready-for-captain
# assign sheet with the REAL captains
- tapOn:
    point: 50%,92%
- extendedWaitUntil:
    visible: ".*اكتمل اليوم.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-c7-captains-sheet
- tapOn: ".*ناصر.*"
- waitForAnimationToEnd
- tapOn:
    point: 50%,95%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*جاري التوصيل.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-c8-assigned-in-delivery
