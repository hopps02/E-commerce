# NEW-USER FUNNEL: a brand-new customer (no saved address) signs up, picks
# their location, adds a low-stock product (counter must cap), and the cart
# auto-creates their default address from the picked location, prices the
# order, and places it. The whole first-order journey in one run.
appId: com.utr.foryou
---
- stopApp
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "تسجيل الخروج"
    commands:
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "الرئيسية"
    commands:
      - tapOn:
          point: 14%,92%
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "تسجيل الخروج"
          direction: DOWN
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "تسجيل الدخول"
    timeout: 15000
- tapOn: "أدخل رقم جوالك"
- inputText: "500009990"
- tapOn:
    point: 50%,63%
- extendedWaitUntil:
    visible: "تأكيد"
    timeout: 15000
- tapOn:
    text: "_"
    index: 0
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- tapOn: "تأكيد"
- extendedWaitUntil:
    visible: "ابدأ التسوق"
    timeout: 15000
- tapOn: "ابدأ التسوق"
- waitForAnimationToEnd
# pick the location through the existing dialog (primary CTA enables GPS)
- runFlow:
    when:
      visible: "تفعيل الموقع"
    commands:
      - takeScreenshot: /tmp/qa-k1-location-dialog
      - tapOn: ".*تفعيل الموقع.*"
      - waitForAnimationToEnd
- takeScreenshot: /tmp/qa-k2-home-after-location
# add the low-stock bun from search
- tapOn: "بحث..."
- waitForAnimationToEnd
- tapOn:
    point: 50%,11%
- inputText: "صامولي"
- extendedWaitUntil:
    visible: ".*خبز صامولي.*"
    timeout: 15000
- tapOn: ".*خبز صامولي.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "إضافة للسلة"
    timeout: 15000
- tapOn: "إضافة للسلة"
- extendedWaitUntil:
    visible: ".*عرض السلة.*"
    timeout: 10000
- tapOn: ".*عرض السلة.*"
- waitForAnimationToEnd
# the cart must price the order — auto-creating the address on the way
- extendedWaitUntil:
    visible: "تكلفة الشحن"
    timeout: 20000
- takeScreenshot: /tmp/qa-k3-cart-auto-address
# hammer + four times: stock is 2 so the counter must stop at 2
- tapOn:
    point: 19%,25%
- tapOn:
    point: 19%,25%
- tapOn:
    point: 19%,25%
- tapOn:
    point: 19%,25%
- takeScreenshot: /tmp/qa-k4-counter-capped
- waitForAnimationToEnd
# checkout: the confirm screen must show the same quantity (x2)
- tapOn: "طلب الآن"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*x2.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-k5-confirm-x2
# place it
- tapOn:
    point: 50%,91%
- extendedWaitUntil:
    visible: "تم الطلب بنجاح"
    timeout: 20000
- assertVisible: ".*GOC-.*"
- takeScreenshot: /tmp/qa-k6-new-user-order-placed
