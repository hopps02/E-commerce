# Continues A1 from the open GOC-00000015 details: tick items, confirm
# readiness, assign the captain.
appId: com.utr.foryou
---
- takeScreenshot: /tmp/qa-g2-cashier-details
- tapOn:
    point: 10%,34%
- tapOn:
    point: 10%,41%
- takeScreenshot: /tmp/qa-g3-cashier-prepared
- tapOn:
    point: 50%,91%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*تعيين كابتن.*"
    timeout: 15000
- tapOn:
    point: 50%,91%
- extendedWaitUntil:
    visible: ".*اكتمل اليوم.*"
    timeout: 15000
- tapOn: ".*ناصر.*"
- waitForAnimationToEnd
- tapOn:
    point: 50%,95%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*جاري التوصيل.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-g4-cashier-assigned
