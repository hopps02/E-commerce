# CUSTOMER PURCHASE E2E (real user): login -> real home -> search ->
# product details -> cart (2 items) -> checkout -> place order ->
# success -> order details -> my orders (current).
appId: com.utr.foryou
---
- stopApp
- launchApp
- waitForAnimationToEnd
# staff session from a previous run -> log out from the home header
- runFlow:
    when:
      visible: "تسجيل الخروج"
    commands:
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
      - waitForAnimationToEnd
# customer session from a previous run -> log out from the profile
- runFlow:
    when:
      visible: "الرئيسية"
    commands:
      - tapOn:
          point: 14%,92%
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "تسجيل الخروج"
          direction: DOWN
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "تسجيل الدخول"
    timeout: 15000
- tapOn: "أدخل رقم جوالك"
- inputText: "500003003"
- tapOn: "تسجيل الدخول"
- tapOn: "إرسال رمز التحقق"
- extendedWaitUntil:
    visible: "تأكيد"
    timeout: 15000
- tapOn:
    text: "_"
    index: 0
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- tapOn: "تأكيد"
- extendedWaitUntil:
    visible: "ابدأ التسوق"
    timeout: 15000
- tapOn: "ابدأ التسوق"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "تفعيل الموقع"
    commands:
      - tapOn:
          point: 8%,84%
      - waitForAnimationToEnd
# HOME: real categories grid + real product sections
- extendedWaitUntil:
    visible: ".*الخبز والمخبوزات.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-f1-home-real
# SEARCH: from the home search bar
- tapOn: "بحث..."
- waitForAnimationToEnd
- tapOn:
    point: 50%,11%
- inputText: "خبز"
- extendedWaitUntil:
    visible: ".*خبز صامولي.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-f2-search-results
# PRODUCT DETAILS: open the first bread, add it to the cart
- tapOn: ".*خبز صامولي.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "إضافة للسلة"
    timeout: 15000
- takeScreenshot: /tmp/qa-f3-product-details
- tapOn: "إضافة للسلة"
- extendedWaitUntil:
    visible: ".*عرض السلة.*"
    timeout: 10000
# back to search, add the second bread from its details
- tapOn:
    point: 89%,11%
- waitForAnimationToEnd
- tapOn: ".*خبز تورتيلا.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "إضافة للسلة"
    timeout: 15000
- tapOn: "إضافة للسلة"
- extendedWaitUntil:
    visible: ".*عرض السلة.*"
    timeout: 10000
# CART: both lines + backend-priced summary (shipping 15)
- tapOn: ".*عرض السلة.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "تكلفة الشحن"
    timeout: 15000
- assertVisible: ".*خبز صامولي.*"
- assertVisible: ".*خبز تورتيلا.*"
- takeScreenshot: /tmp/qa-f4-cart
# CHECKOUT: confirm screen shows the real saved address
- tapOn: "طلب الآن"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*حي العليا.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-f5-confirm
# CustomInkButton misses text-located taps; aim at the button itself
- tapOn:
    point: 50%,91%
# SUCCESS: real order number
- extendedWaitUntil:
    visible: "تم الطلب بنجاح"
    timeout: 20000
- assertVisible: ".*GOC-.*"
- takeScreenshot: /tmp/qa-f6-order-success
# ORDER DETAILS via the success CTA
- tapOn: ".*عرض الطلب.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*GOC-.*"
    timeout: 15000
- assertVisible: ".*حي العليا.*"
- takeScreenshot: /tmp/qa-f7-order-details
# back to home, then MY ORDERS current tab shows the new order
- tapOn:
    point: 89%,11%
- waitForAnimationToEnd
- tapOn:
    point: 29%,92%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*GOC-.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-f8-my-orders-current
