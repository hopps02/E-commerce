# LIFECYCLE C2a — put 2 buns in the cart while stock allows it.
appId: com.utr.foryou
---
# back out of banana details, then out of the category grid, to home
- tapOn:
    point: 89%,11%
- waitForAnimationToEnd
- tapOn:
    point: 89%,11%
- waitForAnimationToEnd
# search for the bun and open it
- tapOn: "بحث..."
- waitForAnimationToEnd
- tapOn:
    point: 50%,11%
- inputText: "صامولي"
- extendedWaitUntil:
    visible: ".*خبز صامولي.*"
    timeout: 15000
- tapOn: ".*خبز صامولي.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "إضافة للسلة"
    timeout: 15000
- tapOn: "إضافة للسلة"
- extendedWaitUntil:
    visible: ".*عرض السلة.*"
    timeout: 10000
- tapOn: ".*عرض السلة.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "تكلفة الشحن"
    timeout: 15000
# bump the line to 2 with the card stepper
- tapOn:
    point: 19%,25%
- waitForAnimationToEnd
- takeScreenshot: /tmp/qa-i3-cart-qty2
