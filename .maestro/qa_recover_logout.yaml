# Recovery: back out of any details screen, then log the customer out.
appId: com.utr.foryou
---
- tapOn:
    point: 89%,11%
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "الرئيسية"
    commands:
      - tapOn:
          point: 14%,92%
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "تسجيل الخروج"
          direction: DOWN
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "تسجيل الدخول"
    timeout: 15000
