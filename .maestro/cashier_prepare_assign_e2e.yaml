# FULL cashier core loop against the live local backend:
# open order -> check off all 3 items (real PATCH) -> confirm readiness
# (real POST, placed->ready_for_pickup) -> assign a REAL captain
# (real GET available-captains + POST assign-captain -> captain_assigned).
appId: com.utr.foryou
---
- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*JAR-.*"
    timeout: 20000
# first prepare card -> details
- tapOn:
    point: 50%,67%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*الكمية.*"
    timeout: 15000
# tick the three "prepared" checkboxes (real backend PATches)
- tapOn:
    point: 10%,34%
- tapOn:
    point: 10%,41%
- tapOn:
    point: 10%,49%
- takeScreenshot: /tmp/4u-p2-all-prepared
# confirm readiness -> placed/preparing -> ready_for_pickup
- tapOn:
    point: 50%,92%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*تعيين كابتن.*"
    timeout: 15000
- takeScreenshot: /tmp/4u-p2-ready-for-captain
# open the assign sheet -> REAL captains from the branch
- tapOn:
    point: 50%,92%
- extendedWaitUntil:
    visible: ".*ناصر.*"
    timeout: 15000
- takeScreenshot: /tmp/4u-p2-captains-real
# pick the first captain and confirm the REAL assignment
- tapOn: ".*ناصر.*"
- waitForAnimationToEnd
- tapOn:
    point: 50%,95%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*جاري التوصيل.*"
    timeout: 15000
- takeScreenshot: /tmp/4u-p2-captain-assigned
