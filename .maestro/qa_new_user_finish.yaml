# Finish the new-user funnel from the cart: confirm shows x2, place, success.
appId: com.utr.foryou
---
- tapOn:
    point: 50%,91%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*x2.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-k5-confirm-x2
- tapOn:
    point: 50%,91%
- extendedWaitUntil:
    visible: "تم الطلب بنجاح"
    timeout: 20000
- assertVisible: ".*GOC-.*"
- takeScreenshot: /tmp/qa-k6-new-user-order-placed
