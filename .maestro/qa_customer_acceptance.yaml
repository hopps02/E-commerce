# CUSTOMER ACCEPTANCE: logout captain -> login JAR-000385's owner ->
# My Orders previous -> delivered card -> details -> rate all four axes.
appId: com.utr.foryou
---
- stopApp
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "تسجيل الخروج"
    commands:
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
- runFlow:
    when:
      visible: "تسجيل الدخول"
    commands:
      - tapOn: "أدخل رقم جوالك"
      - inputText: "500003006"
      - tapOn: "تسجيل الدخول"
      - tapOn: "إرسال رمز التحقق"
      - extendedWaitUntil:
          visible: "تأكيد"
          timeout: 15000
      - tapOn:
          text: "_"
          index: 0
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - tapOn: "تأكيد"
      - extendedWaitUntil:
          visible: "ابدأ التسوق"
          timeout: 15000
      - takeScreenshot: /tmp/qa-e1-auth-success
      - tapOn: "ابدأ التسوق"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "تفعيل الموقع"
    commands:
      - tapOn:
          point: 8%,84%
      - waitForAnimationToEnd
- takeScreenshot: /tmp/qa-e2-customer-home
# My Orders tab (bottom navigation icon)
- tapOn:
    point: 29%,92%
- waitForAnimationToEnd
- takeScreenshot: /tmp/qa-e3-orders-current
- tapOn: "السابقة"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*JAR-000385.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-e4-orders-previous
# open details (button on the card's right side)
- tapOn:
    point: 81%,54%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*JAR-000385.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-e5-details-top
- scrollUntilVisible:
    element:
      text: ".*ملخص السعر.*"
    direction: DOWN
- takeScreenshot: /tmp/qa-e6-price-summary
# rate it: open the sheet, 5-star the big axis (rightmost = 5 in this widget),
# star each small axis, send
- tapOn: ".*تقييم.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*إرسال.*"
    timeout: 10000
- tapOn:
    point: 75%,52%
- tapOn:
    point: 25%,60%
- tapOn:
    point: 25%,64%
- tapOn:
    point: 25%,68%
- takeScreenshot: /tmp/qa-e7-rate-filled
- tapOn: ".*إرسال.*"
- waitForAnimationToEnd
- takeScreenshot: /tmp/qa-e8-rate-done
