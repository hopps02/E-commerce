# ADDRESSES part 2: delete the non-default address (confirm sheet), then
# verify checkout uses the new default and the picker sheet opens from it.
appId: com.utr.foryou
---
# delete the second card (the old auto-address)
- tapOn:
    point: 12%,52%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*هل أنت متأكد أنك تريد حذف هذا العنوان.*"
    timeout: 10000
- takeScreenshot: /tmp/qa-m5-delete-confirm
- tapOn: "حذف"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*النرجس.*"
    timeout: 15000
- assertNotVisible: ".*المنزل.*"
- takeScreenshot: /tmp/qa-m6-after-delete
# back home, buy something, and check the confirm screen address
- tapOn:
    point: 89%,11%
- waitForAnimationToEnd
- tapOn:
    point: 86%,92%
- waitForAnimationToEnd
- tapOn: "بحث..."
- waitForAnimationToEnd
- tapOn:
    point: 50%,11%
- inputText: "تورتيلا"
- extendedWaitUntil:
    visible: ".*خبز تورتيلا.*"
    timeout: 15000
- tapOn: ".*خبز تورتيلا.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "إضافة للسلة"
    timeout: 15000
- tapOn: "إضافة للسلة"
- extendedWaitUntil:
    visible: ".*عرض السلة.*"
    timeout: 10000
- tapOn: ".*عرض السلة.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "تكلفة الشحن"
    timeout: 20000
- tapOn:
    point: 50%,91%
- waitForAnimationToEnd
# the confirm screen must carry the NEW default address
- extendedWaitUntil:
    visible: ".*النرجس.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-m7-confirm-new-default
# the address card opens the picker sheet
- tapOn: ".*النرجس.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*إضافة عنوان.*"
    timeout: 10000
- takeScreenshot: /tmp/qa-m8-picker-sheet
