# FULL captain loop against the live local backend, CONTINUING the order the
# cashier assigned (JAR-000386 -> captain ناصر احمد):
# logout cashier -> login captain +966550001000 -> upcoming shows the real
# order -> accept (received) -> start delivery -> confirm delivered ->
# outcome screen. Backend state must end at `delivered`.
appId: com.utr.foryou
---
- launchApp
- waitForAnimationToEnd
# logout any existing staff session (header glass button), if present
- runFlow:
    when:
      visible: "تسجيل الخروج"
    commands:
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
- extendedWaitUntil:
    visible: "تسجيل الدخول"
    timeout: 20000
# login as the captain
- tapOn: "أدخل رقم جوالك"
- inputText: "550001000"
- tapOn: "تسجيل الدخول"
- tapOn: "إرسال رمز التحقق"
- extendedWaitUntil:
    visible: "تأكيد"
    timeout: 15000
- tapOn:
    text: "_"
    index: 0
- inputText: "000000"
- tapOn: "تأكيد"
- extendedWaitUntil:
    visible: "ابدأ التسوق"
    timeout: 15000
- tapOn: "ابدأ التسوق"
- waitForAnimationToEnd
# captain home greeted by name + the REAL assigned order in upcoming
- extendedWaitUntil:
    visible: ".*ناصر.*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*JAR-.*"
    timeout: 15000
- takeScreenshot: /tmp/4u-p3-captain-upcoming
# open details
- tapOn: ".*فتح.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*قائمة المنتجات.*"
    timeout: 15000
- takeScreenshot: /tmp/4u-p3-captain-details-upcoming
# accept & receive (captain_assigned -> received_by_captain)
- tapOn:
    point: 50%,88%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*بدء التوصيل.*"
    timeout: 15000
- takeScreenshot: /tmp/4u-p3-captain-received
# start delivery (received -> out_for_delivery)
- tapOn:
    point: 50%,84%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*تأكيد تسليم الطلب.*"
    timeout: 15000
- takeScreenshot: /tmp/4u-p3-captain-in-delivery
# confirm delivered (out_for_delivery -> delivered) -> success outcome
- tapOn:
    point: 50%,84%
- waitForAnimationToEnd
- takeScreenshot: /tmp/4u-p3-captain-delivered-outcome
