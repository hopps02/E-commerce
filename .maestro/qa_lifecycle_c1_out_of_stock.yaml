# LIFECYCLE C1 — a sold-out product (banana, stock 0): the add tap must be
# clamped with the stock toast, and the details screen must say unavailable.
appId: com.utr.foryou
---
# back out of the rejected order details to the orders tab, then home
- tapOn:
    point: 89%,11%
- waitForAnimationToEnd
- tapOn:
    point: 86%,92%
- waitForAnimationToEnd
# open the fruits & vegetables category from the real categories grid
- scrollUntilVisible:
    element:
      text: ".*الخضار والفواكه.*"
    direction: DOWN
- tapOn: ".*الخضار والفواكه.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*موز.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-i1-category-with-banana
# open the banana details — it must say unavailable
- tapOn: ".*موز.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*غير متوفر.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-i2-banana-unavailable
