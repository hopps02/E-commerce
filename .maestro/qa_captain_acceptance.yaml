# CAPTAIN ACCEPTANCE on the clean QA sim: logout cashier -> login captain ->
# upcoming has JAR-000385 -> accept -> start -> deliver -> completed tab.
appId: com.utr.foryou
---
- stopApp
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "تسجيل الخروج"
    commands:
      - tapOn: "تسجيل الخروج"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "رجوع"
          timeout: 10000
      - tapOn:
          text: "تسجيل الخروج"
- runFlow:
    when:
      visible: "تسجيل الدخول"
    commands:
      - tapOn: "أدخل رقم جوالك"
      - inputText: "550001000"
      - tapOn: "تسجيل الدخول"
      - tapOn: "إرسال رمز التحقق"
      - extendedWaitUntil:
          visible: "تأكيد"
          timeout: 15000
      - takeScreenshot: /tmp/qa-d1-otp
      - tapOn:
          text: "_"
          index: 0
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - inputText: "0"
      - tapOn: "تأكيد"
      - extendedWaitUntil:
          visible: "ابدأ التسوق"
          timeout: 15000
      - tapOn: "ابدأ التسوق"
      - waitForAnimationToEnd
# captain home: greeted by name + availability pill + the real assigned order
- extendedWaitUntil:
    visible: ".*ناصر.*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*JAR-000385.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-d2-upcoming
- tapOn: ".*فتح.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*قائمة المنتجات.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-d3-details-upcoming
# accept & receive
- tapOn:
    point: 50%,88%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*بدء التوصيل.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-d4-received
# start delivery
- tapOn:
    point: 50%,84%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*تأكيد تسليم الطلب.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-d5-in-delivery
# confirm delivered (by TEXT — points missed this button before)
- tapOn: ".*تأكيد تسليم الطلب.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*العودة للرئيسية.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-d6-success-outcome
- tapOn: ".*العودة للرئيسية.*"
- waitForAnimationToEnd
# completed tab shows it delivered
- tapOn: ".*المكتملة.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*JAR-000385.*"
    timeout: 15000
- takeScreenshot: /tmp/qa-d7-completed
