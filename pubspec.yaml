name: jar
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.12
  dartz: ^0.10.1
  dio:
  internet_connection_checker: ^3.0.1
  flutter_screenutil: ^5.9.3
  pretty_dio_logger: ^1.3.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  pull_to_refresh: ^2.0.0
  equatable: ^2.0.5
  decimal: ^3.0.2
  flutter_dotenv: ^6.0.0
  easy_localization: ^3.0.7
  flutter_phoenix: ^1.1.1
  file_picker: ^10.3.3
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  flutter_otp_text_field: ^1.1.0+2
  flutter_animate: ^4.5.2
  share_plus: ^12.0.1
  fluttertoast: ^9.0.0
  url_launcher: ^6.3.1
  defer_pointer: ^0.0.2
  animated_visibility: ^0.0.4
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  back_button_interceptor: ^8.0.4
  percent_indicator: ^4.2.5
  smooth_corner: ^1.1.1
  flutter_riverpod: ^3.3.1
  riverpod: ^3.2.1
  hooks_riverpod: ^3.3.1
  riverpod_sqflite: ^0.4.2
  flutter_local_notifications: ^20.1.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  async: ^2.13.1

  nice_text_form:
      git: https://github.com/ahmedjihad2024/nice_text_form.git

dependency_overrides:
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.12.0
  flutter_gen_runner:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app-icon.png"
  min_sdk_android: 21


flutter_gen:
  output: lib/presentation/res/gen/

  integrations:
    image: true
    flutter_svg: true
    rive: false
    lottie: false
  fonts:
    enabled: false

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/svg/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: ibmp_plex_sans_arabic
      fonts:
        - asset: assets/fonts/ibmp_plex_sans_arabic/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/ibmp_plex_sans_arabic/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/ibmp_plex_sans_arabic/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/ibmp_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibmp_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibmp_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibmp_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700